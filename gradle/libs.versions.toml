[versions]
agp = "9.1.1"
kotlin = "2.3.21"
ksp = "2.3.9"
composeBom = "2025.12.01"
material3 = "1.5.0-alpha18"
exifinterface = "1.3.6"
graphicsShapes = "1.0.1"
coreKtx = "1.15.0"
splashscreen = "1.2.0"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
preferenceKtx = "1.2.1"
datastore = "1.2.1"
biometric = "1.2.0-alpha05"
fragmentKtx = "1.8.5"
kotlinxSerialization = "1.7.3"
composeDestinations = "2.1.0"
accompanist = "0.37.3"
koinBom = "4.1.1"
room = "2.8.5"
coil = "2.7.0"
zxing = "3.5.4"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
billing = "8.0.0"
rustoreBom = "2026.04.01"
rustorePay = "10.3.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }

core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preferenceKtx" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

compose-destinations-core = { module = "io.github.raamcosta.compose-destinations:core", version.ref = "composeDestinations" }
compose-destinations-ksp = { module = "io.github.raamcosta.compose-destinations:ksp", version.ref = "composeDestinations" }

accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinBom" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
rustore-bom = { module = "ru.rustore.sdk:bom", version.ref = "rustoreBom" }
rustore-pay = { module = "ru.rustore.sdk:pay", version.ref = "rustorePay" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
